[package]
name = "sentinel-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sentinel-core = { path = "../sentinel-core" }
sentinel-ast = { path = "../sentinel-ast" }
sentinel-scanner = { path = "../sentinel-scanner" }
sentinel-llm = { path = "../sentinel-llm" }
sentinel-report = { path = "../sentinel-report" }
sentinel-db = { path = "../sentinel-db" }
sentinel-graph = { path = "../sentinel-graph" }
sentinel-mcp = { path = "../sentinel-mcp" }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
colored = "2.1"
thiserror = "1.0"
anyhow = "1.0"
serde_json = "1.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
crossterm = "0.29"
dotenvy = "0.15.7"

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
