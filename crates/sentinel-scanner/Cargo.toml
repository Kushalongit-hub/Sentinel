[package]
name = "sentinel-scanner"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
sentinel-core = { path = "../sentinel-core" }
sentinel-ast = { path = "../sentinel-ast" }
sentinel-taint = { path = "../sentinel-taint" }
thiserror = "1.0"
which = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.11", features = ["v4"] }
regex = "1.10"
