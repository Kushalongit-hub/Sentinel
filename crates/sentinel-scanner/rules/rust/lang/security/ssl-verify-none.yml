rules:
  - id: rust-ssl-verify-none
    message: SSL verification disabled via set_verify(SSL_VERIFY_NONE)
    pattern: set_verify(openssl::ssl::SSL_VERIFY_NONE)
    metadata:
      references:
        - https://docs.rs/openssl/latest/openssl/ssl/struct.SslContextBuilder.html#method.set_verify
      technology:
        - openssl
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      confidence: HIGH
      likelihood: LOW
      impact: MEDIUM
      subcategory: vuln
    languages: [rust]
    severity: WARNING
