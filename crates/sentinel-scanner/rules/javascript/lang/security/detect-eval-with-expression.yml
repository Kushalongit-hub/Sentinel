rules:
  - id: javascript-detect-eval-with-expression
    message: URL-controlled input reaches a dynamic execution call.
    languages: [javascript, typescript]
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: location.href
      - pattern: location.hash
      - pattern: location.search
      - pattern: window.location.href
      - pattern: window.location.hash
      - pattern: window.location.search
    pattern-sinks:
      - pattern: eval(
      - pattern: Function(
      - pattern: setTimeout(
      - pattern: setInterval(
