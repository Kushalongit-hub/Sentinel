rules:
  - id: js-unsafe-json-parse
    message: Network input reaches JSON.parse. Validate input size and structure before using the parsed object.
    languages: [javascript, typescript]
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: req.body
      - pattern: req.query
      - pattern: raw.toString()
    pattern-sinks:
      - pattern: JSON.parse(
