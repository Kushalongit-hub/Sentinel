rules:
  - id: javascript-detect-child-process
    message: Function parameter reaches an execution call. Verify the command cannot be controlled by an untrusted caller.
    languages: [javascript, typescript]
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: '@parameter'
    pattern-sinks:
      - pattern: exec(
      - pattern: execSync(
      - pattern: spawn(
      - pattern: spawnSync(
