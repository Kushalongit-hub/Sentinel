rules:
  - id: javascript-detect-insecure-websocket
    message: Insecure remote WebSocket URL detected. Use wss for encrypted connections.
    languages: [regex]
    severity: WARNING
    pattern-regex: '\bws://[^\s"''`)]+'
    pattern-not-regex: '\bws://(?:localhost|127\.0\.0\.1)(?::[0-9]+)?(?:/[^\s"''`)]*)?(?:[\s"''`)]|$)'
