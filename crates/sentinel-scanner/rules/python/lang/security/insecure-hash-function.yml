rules:
  - id: python-insecure-hash-function
    message: Insecure MD4 or MD5 hashing detected; use a modern digest for security decisions.
    languages: [python]
    severity: WARNING
    pattern-regex: '(?i)hashlib\.(?:new\(\s*["'']md[45]["''][^\n)]*\)|md5\([^\n)]*\))'
    pattern-not-regex: '(?i)hashlib\.(?:new|md5)\([^\n)]*usedforsecurity\s*=\s*False[^\n)]*\)'
